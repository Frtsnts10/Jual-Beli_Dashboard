# Deploys firestore.rules and firestore.indexes.json to Firebase whenever they change on
# main, so the live security rules always match the code. Can also be run by hand from
# the Actions tab ("Run workflow").
#
# One-time setup — repository secret FIREBASE_SERVICE_ACCOUNT:
#   1. Google Cloud Console → IAM → Service Accounts → Create (e.g. "github-firestore-deploy")
#      with roles "Firebase Rules Admin" and "Cloud Datastore Index Admin".
#   2. Keys → Add key → JSON, download it.
#   3. GitHub → Settings → Secrets and variables → Actions → New repository secret,
#      name FIREBASE_SERVICE_ACCOUNT, paste the whole JSON. Then delete the local file.
name: Deploy Firestore rules & indexes

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
  workflow_dispatch:

# Never let two deploys race each other.
concurrency:
  group: firestore-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: web-store-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set (see the comment at the top of this workflow)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy
        run: npx --yes firebase-tools@15.36.0 deploy --only firestore --project "$PROJECT_ID" --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
